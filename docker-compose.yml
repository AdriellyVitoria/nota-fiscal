services:
  postgres:
    image: postgres:17
    container_name: nfe-postgres
    environment:
      POSTGRES_DB: nfe
      POSTGRES_USER: nfe
      POSTGRES_PASSWORD: nfe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  sefaz:
    build: ./sefaz-mock
    container_name: nfe-sefaz
    ports:
      - "8180:8080"
      - "9991:9990"

volumes:
  pgdata:

# --- HTTP ---
# 8080 está ocupada pelo Apache nesta máquina
quarkus.http.port=8081
# Testes usam uma porta aleatória para não brigar com o dev mode
quarkus.http.test-port=0

# --- Banco de dados ---
quarkus.datasource.db-kind=postgresql
# Em dev/prod usa o Postgres do docker-compose; nos testes (%test) não há URL,
# então o Quarkus Dev Services sobe um Postgres temporário automaticamente.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/nfe
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/nfe}
%dev.quarkus.datasource.username=nfe
%dev.quarkus.datasource.password=nfe
%prod.quarkus.datasource.username=${DB_USER:nfe}
%prod.quarkus.datasource.password=${DB_PASSWORD:nfe}

# O Flyway cria/atualiza as tabelas; o Hibernate só confere se as entidades batem com o banco
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true

# --- Emitente (empresa que emite as notas) ---
nfe.emitente.cnpj=11222333000181
nfe.emitente.razao-social=Loja Estudo LTDA
nfe.emitente.uf=SP
nfe.emitente.codigo-uf=35
nfe.emitente.serie=1

# --- OpenAPI / Swagger ---
quarkus.smallrye-openapi.info-title=NF-e Estudo API
quarkus.swagger-ui.always-include=true
